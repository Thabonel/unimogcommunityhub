  <rect x="76" y="25" width="8" height="20" fill="white" rx="1"/>
  <rect x="87" y="25" width="8" height="20" fill="white" rx="1"/>
  <rect x="98" y="25" width="8" height="20" fill="white" rx="1"/>
  <rect x="109" y="25" width="8" height="20" fill="white" rx="1"/>
  <rect x="120" y="25" width="8" height="20" fill="white" rx="1"/>

