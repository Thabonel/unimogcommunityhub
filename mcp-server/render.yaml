services:
  - type: web
    name: unimog-wis-mcp-server
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_TRANSPORT
        value: http
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: QUERY_TIMEOUT_MS
        value: 15000
      - key: STORAGE_SIGN_TTL_SEC
        value: 300
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPTIONAL_SERVICE_ROLE
        sync: false
      - key: OPTIONAL_BEARER_TOKEN
        sync: false
    healthCheckPath: /health