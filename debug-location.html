<!DOCTYPE html>
<html>
<head>
    <title>Location Debug for Unimog Community Hub</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Location Debug Tool</h1>

    <div class="section">
        <h2>Browser Detection</h2>
        <div id="browser-info"></div>
    </div>

    <div class="section">
        <h2>Geolocation Test</h2>
        <button onclick="testGeolocation()">Test Geolocation</button>
        <button onclick="clearCache()">Clear Cache</button>
        <div id="geo-results"></div>
    </div>

    <div class="section">
        <h2>Cached Data</h2>
        <div id="cached-data"></div>
    </div>

    <div class="section">
        <h2>Debug Log</h2>
        <div id="debug-log"></div>
    </div>

    <script>
        function log(message, data = null) {
            const logDiv = document.getElementById('debug-log');
            const entry = document.createElement('div');
            entry.className = 'log';
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}` +
                (data ? `<br><pre>${JSON.stringify(data, null, 2)}</pre>` : '');
            logDiv.appendChild(entry);
        }

        function detectBrowserInfo() {
            const info = {
                language: navigator.language,
                languages: navigator.languages,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                userAgent: navigator.userAgent,
                platform: navigator.platform
            };

            document.getElementById('browser-info').innerHTML = `
                <div class="log">
                    <strong>Language:</strong> ${info.language}<br>
                    <strong>Languages:</strong> ${info.languages.join(', ')}<br>
                    <strong>Timezone:</strong> ${info.timezone}<br>
                    <strong>Platform:</strong> ${info.platform}<br>
                    <strong>User Agent:</strong> ${info.userAgent}
                </div>
            `;

            log('Browser info detected', info);

            // Test locale-based country detection
            const sources = [navigator.language, ...navigator.languages, 'en-US'];
            for (const locale of sources) {
                const parts = locale.split('-');
                if (parts.length > 1) {
                    const countryCode = parts[1].toUpperCase();
                    if (countryCode.length === 2) {
                        log(`Country from locale ${locale}: ${countryCode}`);
                        break;
                    }
                }
            }

            // Test timezone-based detection
            if (info.timezone.includes('Australia') ||
                info.timezone.includes('Adelaide') ||
                info.timezone.includes('Brisbane') ||
                info.timezone.includes('Darwin') ||
                info.timezone.includes('Hobart') ||
                info.timezone.includes('Melbourne') ||
                info.timezone.includes('Perth') ||
                info.timezone.includes('Sydney')) {
                log('Australia detected from timezone!');
            } else {
                log('Australia NOT detected from timezone');
            }
        }

        async function testGeolocation() {
            log('Starting geolocation test...');

            if (!navigator.geolocation) {
                log('❌ Geolocation not supported');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const coords = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    };

                    log('✅ Coordinates obtained', coords);

                    // Test reverse geocoding
                    try {
                        const response = await fetch(
                            `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${coords.latitude}&longitude=${coords.longitude}&localityLanguage=en`
                        );

                        if (response.ok) {
                            const geoData = await response.json();
                            log('✅ Reverse geocoding successful', geoData);

                            const result = {
                                country: geoData.countryName || 'Unknown',
                                countryCode: geoData.countryCode || 'US',
                                city: geoData.city || geoData.locality,
                                region: geoData.principalSubdivision
                            };

                            log('🌍 Final country result', result);

                            document.getElementById('geo-results').innerHTML = `
                                <div class="log">
                                    <strong>Country:</strong> ${result.country}<br>
                                    <strong>Country Code:</strong> ${result.countryCode}<br>
                                    <strong>City:</strong> ${result.city || 'Unknown'}<br>
                                    <strong>Currency should be:</strong> ${result.countryCode === 'AU' ? 'AUD' : 'USD'}
                                </div>
                            `;
                        } else {
                            log('❌ Reverse geocoding failed', { status: response.status });
                        }
                    } catch (error) {
                        log('❌ Reverse geocoding error', error.message);
                    }
                },
                (error) => {
                    log('❌ Geolocation error', {
                        code: error.code,
                        message: error.message
                    });
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 300000
                }
            );
        }

        function showCachedData() {
            const keys = ['lastKnownLocationWithCurrency', 'geo_location_data'];
            let cachedHtml = '';

            for (const key of keys) {
                const data = localStorage.getItem(key);
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        cachedHtml += `
                            <div class="log">
                                <strong>${key}:</strong><br>
                                <pre>${JSON.stringify(parsed, null, 2)}</pre>
                            </div>
                        `;
                        log(`Cached data found: ${key}`, parsed);
                    } catch (e) {
                        cachedHtml += `
                            <div class="log">
                                <strong>${key}:</strong> Invalid JSON<br>
                                <pre>${data}</pre>
                            </div>
                        `;
                    }
                } else {
                    cachedHtml += `<div class="log"><strong>${key}:</strong> Not cached</div>`;
                }
            }

            document.getElementById('cached-data').innerHTML = cachedHtml || '<div class="log">No cached data found</div>';
        }

        function clearCache() {
            localStorage.removeItem('lastKnownLocationWithCurrency');
            localStorage.removeItem('geo_location_data');
            log('🗑️ Cache cleared');
            showCachedData();
        }

        // Initialize
        detectBrowserInfo();
        showCachedData();
    </script>
</body>
</html>
