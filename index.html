
<!DOCTYPE html>
<html lang="en">

    <meta name="author" content="Unimog Community Hub" />
    
    <!-- Force no caching to prevent JS bundle corruption -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="shortcut icon" href="/favicon.ico?t=1754719200" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?t=1754719200" />

    <link rel="manifest" href="/site.webmanifest?t=1754719200" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Unimog Community Hub - Connect, Share, Explore" />
    <meta property="og:description" content="The ultimate community platform for Unimog enthusiasts. Connect with fellow owners, share knowledge, plan expeditions, and live the Unimog lifestyle." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/hero-wheels.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unimog Community Hub" />
    <meta name="twitter:description" content="The ultimate community platform for Unimog enthusiasts." />
    <meta name="twitter:image" content="/hero-wheels.jpg" />
    
    <!-- Self-hosted Special Elite font for rugged styling - eliminates CDN dependency -->
    <link rel="preload" href="/fonts/special-elite.ttf" as="font" type="font/ttf" crossorigin>

    <!-- Browser compatibility polyfill for Node.js globals -->

      if (typeof global === 'undefined') {
        var global = globalThis || window;
      }
    </script>

    <!-- Meta Pixel Code - Production Only -->
    <script>

    if (window.location.hostname === 'unimogcommunityhub.com' || window.location.hostname === 'www.unimogcommunityhub.com') {
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
